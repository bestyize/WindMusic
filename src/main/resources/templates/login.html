<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheWind</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/wind.css" rel="stylesheet">
    <script src="js/jquery-3.5.1.js"></script>
    <script src="js/winpan.js"></script>
    <script src="js/adopt.js"></script>
    <script src="js/download.js"></script>
    <script src="js/bootstrap.min.js"></script>
</head>
<body style="background-color: #F0F0F0">
<h2>创建模态框（Modal）</h2>
<!-- 按钮触发模态框 -->
<button class="btn btn-primary btn-lg" data-target="#loginModal" data-toggle="modal">登录</button>
<!-- 模态框（Modal） -->
<div aria-hidden="true" aria-labelledby="myModalLabel" class="modal fade" id="loginModal" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header justify-content-center m-auto">
                <h4 class="modal-title" id="myModalLabel">登录</h4>
            </div>
            <div class="modal-body">
                <div class="input-group mb-3">
                    <input class="form-control" placeholder="用户名" type="text">
                    <div class="input-group-append">
                        <span class="input-group-text">用户名</span>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input class="form-control" placeholder="密 码" type="password">
                    <div class="input-group-append">
                        <span class="input-group-text">密&nbsp&nbsp&nbsp&nbsp码</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-dismiss="modal" type="button">取消</button>
                <button class="btn btn-primary" type="button">登录</button>
            </div>
        </div><!-- /.modal-content -->
    </div><!-- /.modal -->
</div>

</body>
</html>
